<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitCampus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2924;
            color: #f4e6c8;
            font-family: Georgia, serif;
        }

        .loader {
            text-align: center;
        }

        .loader-circle {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(244, 230, 200, 0.25);
            border-top-color: #e6b85c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        h1 {
            letter-spacing: 4px;
            font-size: 28px;
        }

        p {
            margin-top: 8px;
            opacity: 0.7;
            font-size: 13px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="loader-circle"></div>

        <h1>BITCAMPUS</h1>

        <p>Preparing your campus...</p>

    </div>

    <script>
        setTimeout(() => {
            window.location.href = "./login.html";
        }, 1400);
    </script>

</body>
</html>
